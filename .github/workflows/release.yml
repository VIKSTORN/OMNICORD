name: Build & release Omnicord

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Release tag must be an integer: the manager compares it to its versionCode.
  OMNICORD_BUILD: ${{ github.run_number }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile || bun install
      - run: node scripts/build.mjs --release-branch main --build-minify
      - run: |
          cd dist
          echo "{\"paths\":[\"omnicord.min.js\"],\"version\":\"${OMNICORD_BUILD}\"}" > info.json
      - uses: actions/upload-artifact@v4
        with: { name: bundle, path: dist/ }

  apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: xposed
            out: OmnicordXposed.apk
          - dir: manager
            out: OmnicordManager.apk
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore (optional, from secrets)
        env:
          KEYSTORE_B64: ${{ secrets.OMNICORD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/omnicord.jks"
            echo "OMNICORD_KEYSTORE=$RUNNER_TEMP/omnicord.jks" >> "$GITHUB_ENV"
          fi
      - name: Build ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        env:
          OMNICORD_KEYSTORE_PASSWORD: ${{ secrets.OMNICORD_KEYSTORE_PASSWORD }}
          OMNICORD_KEY_ALIAS: ${{ secrets.OMNICORD_KEY_ALIAS }}
          OMNICORD_KEY_PASSWORD: ${{ secrets.OMNICORD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.dir }}", path: "${{ matrix.out }}" }

  release:
    needs: [bundle, apks]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.OMNICORD_BUILD }}"
          name: "Omnicord build ${{ env.OMNICORD_BUILD }}"
          make_latest: true
          body: |
            Install: download **OmnicordManager.apk**, open it, tap Install.
            Bundle and module update automatically from this release.
          files: |
            out/omnicord.js
            out/omnicord.min.js
            out/info.json
            out/OmnicordXposed.apk
            out/OmnicordManager.apk
